<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator Persona Design</title>
</head>
<body>
    <div class="app-container">
        <!-- BOTÃO DE VOLUME FINAL -->
        <button id="mute-btn" class="mute-btn" title="Mute/Unmute">
            <img src="mute.jpg" alt="Mute" style="width: 100%; height: 100%; object-fit: contain;">
        </button>

        <div class="bg-shard"></div>
        <div class="wrapper">
            <section class="screen">
                0
            </section>

            <section class="calc-buttons">
                <div class="calc-button-row">
                    <button class="calc-button double">
                        C
                    </button>
                    <button class="calc-button">
                        &larr;
                    </button>
                    <button class="calc-button">
                        &divide;
                    </button>
                </div>

                <div class="calc-button-row">
                    <button class="calc-button">
                        7
                    </button>
                    <button class="calc-button">
                        8
                    </button>
                    <button class="calc-button">
                        9
                    </button>
                    <button class="calc-button">
                        &times;
                    </button>
                </div>

                <div class="calc-button-row">
                    <button class="calc-button">
                        4
                    </button>
                    <button class="calc-button">
                        5
                    </button>
                    <button class="calc-button">
                        6
                    </button>
                    <button class="calc-button">
                        &minus;
                    </button>
                </div>
                
                <div class="calc-button-row">
                    <button class="calc-button">
                        1
                    </button>
                    <button class="calc-button">
                        2
                    </button>
                    <button class="calc-button">
                        3
                    </button>
                    <button class="calc-button">
                        +
                    </button>
                </div>

                <div class="calc-button-row">
                    <button class="calc-button double">
                        0
                    </button>
                    <button class="calc-button">
                        .
                    </button>
                    <button class="calc-button">
                        =
                    </button>
                </div>

            </section>
        </div>

        <div class="big-result-container">
            <h1 id="big-result" class="big-result">43</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
