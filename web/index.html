<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator Persona Design</title>
</head>
<body>
    <div class="app-container">
        <!-- BOTÃO DE VOLUME -->
        <button id="mute-btn" class="mute-btn" title="Mute/Unmute">
            <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;">
                <g class="mute-shapes" stroke="#fcfcfc" stroke-width="5" fill="#2791ff" stroke-linejoin="round">
                    <polygon points="45,10 60,5 65,18 48,22" />
                    <polygon points="40,28 85,25 80,45 42,38" />
                    <polygon points="35,48 55,60 48,68 30,55" />
                    <polygon points="25,58 45,90 32,95 18,65" />
                    <polygon points="10,65 20,62 25,75 12,75" />
                </g>
            </svg>
        </button>

        <div class="bg-shard"></div>
        <div class="wrapper">
            <section class="screen">
                0
            </section>

            <section class="calc-buttons">
                <div class="calc-button-row">
                    <button class="calc-button double">
                        C
                    </button>
                    <button class="calc-button">
                        &larr;
                    </button>
                    <button class="calc-button">
                        &divide;
                    </button>
                </div>

                <div class="calc-button-row">
                    <button class="calc-button">
                        7
                    </button>
                    <button class="calc-button">
                        8
                    </button>
                    <button class="calc-button">
                        9
                    </button>
                    <button class="calc-button">
                        &times;
                    </button>
                </div>

                <div class="calc-button-row">
                    <button class="calc-button">
                        4
                    </button>
                    <button class="calc-button">
                        5
                    </button>
                    <button class="calc-button">
                        6
                    </button>
                    <button class="calc-button">
                        &minus;
                    </button>
                </div>
                
                <div class="calc-button-row">
                    <button class="calc-button">
                        1
                    </button>
                    <button class="calc-button">
                        2
                    </button>
                    <button class="calc-button">
                        3
                    </button>
                    <button class="calc-button">
                        +
                    </button>
                </div>

                <div class="calc-button-row">
                    <button class="calc-button double">
                        0
                    </button>
                    <button class="calc-button">
                        .
                    </button>
                    <button class="calc-button">
                        =
                    </button>
                </div>

            </section>
        </div>

        <div class="big-result-container">
            <h1 id="big-result" class="big-result">43</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
